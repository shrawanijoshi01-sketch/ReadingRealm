<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Users | Reading Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
font-family:'Plus Jakarta Sans';
background:linear-gradient(135deg,#fff0f5,#fde7f3,#f4e8ff);
min-height:100vh;
}

.title{
font-family:'Playfair Display';
}

.glass{
background:rgba(255,255,255,.8);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.5);
}

.gradient{
background:linear-gradient(135deg,#c21874,#8e44ad);
}

</style>

</head>

<body>

<div class="max-w-6xl mx-auto py-10 px-6">

<div class="flex justify-between mb-8">

<a href="/admin"
class="gradient text-white px-6 py-3 rounded-2xl font-bold">

← Dashboard

</a>

</div>

<div class="glass rounded-3xl p-8 shadow-2xl">

<h1 class="title text-5xl text-pink-700 mb-8">

👥 Manage Users

</h1>

<table class="w-full">

<thead>

<tr class="border-b">

<th class="text-left p-4">ID</th>
<th class="text-left p-4">Username</th>
<th class="text-left p-4">Email</th>
<th class="text-left p-4">Role</th>
<th class="text-center p-4">Action</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

</div>

<script>

async function loadUsers(){

const response=await fetch("/api/manage-users");

const users=await response.json();

let html="";

users.forEach(user=>{

html+=`

<tr class="border-b hover:bg-pink-50">

<td class="p-4">${user.id}</td>

<td class="p-4">${user.username}</td>

<td class="p-4">${user.email}</td>

<td class="p-4">${user.role}</td>

<td class="p-4 text-center">

<button
onclick="deleteUser(${user.id})"
class="bg-red-500 text-white px-4 py-2 rounded-xl">

🗑 Delete

</button>

</td>

</tr>

`;

});

document.getElementById("userTable").innerHTML=html;

}

async function deleteUser(id){

if(confirm("Delete this user?")){

const response=await fetch("/api/delete-user/"+id,{
method:"DELETE"
});

const data=await response.json();

alert(data.message);

loadUsers();

}

}

loadUsers();

</script>

</body>

</html>
