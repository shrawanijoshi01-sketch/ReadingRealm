<!DOCTYPE html>
<html class="light" lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Reading Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg,#fff0f5,#fce7f3,#f3e8ff);
    min-height:100vh;
}
.title{
    font-family:'Playfair Display',serif;
}
.gradient{
    background:linear-gradient(135deg,#b10e6b,#783eb2);
}
.glass-card{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.4);
}
.glass-card:hover{
    transform:translateY(-4px);
    transition:.35s ease;
    box-shadow:
        0 35px 70px rgba(177,14,107,0.25),
        0 12px 35px rgba(120,62,178,0.18);
}
</style>

</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="glass-card w-full max-w-md rounded-3xl p-8 shadow-2xl text-center">

    <a href="/" class="inline-block title text-3xl font-bold text-pink-700 mb-2">
        ✨ Reading Realm
    </a>

    <h2 class="text-2xl font-bold text-gray-800 mb-1">
        Create Your Account
    </h2>

    <p class="text-sm text-gray-600 mb-6">
        Join thousands of book lovers in the magical realm
    </p>

    <form id="registerForm" class="space-y-4 text-left">

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Full Name
            </label>

            <input
                type="text"
                id="regName"
                name="username"
                required
                placeholder="Nitin Sharma"
                class="w-full px-4 py-3 rounded-2xl border border-pink-200 outline-none focus:ring-2 focus:ring-pink-400 bg-white border-2 border-pink-200 focus:border-pink-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Email Address
            </label>

            <input
                type="email"
                id="regEmail"
                name="email"
                required
                placeholder="nitin@realm.com"
                class="w-full px-4 py-3 rounded-2xl border border-pink-200 outline-none focus:ring-2 focus:ring-pink-400 bg-white/80">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Password
            </label>

            <input
                type="password"
                id="regPassword"
                name="password"
                required
                placeholder="••••••••"
                class="w-full px-4 py-3 rounded-2xl border border-pink-200 outline-none focus:ring-2 focus:ring-pink-400 bg-white/80">
        </div>

        <button
            type="submit"
            class="w-full gradient text-white py-3.5 rounded-2xl font-bold hover:scale-[1.02] active:scale-95 transition-all shadow-lg mt-4">

            Join Reading Realm

        </button>

    </form>

    <p class="text-xs text-gray-600 mt-6">
        Already have an account?
        <a href="/login" class="text-pink-600 font-bold hover:underline">
            Sign In
        </a>
    </p>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(this);

    try{

        const response = await fetch("/register",{
            method:"POST",
            body:formData
        });

        const data = await response.json();

        if(data.success){

            alert("🎉 Registration Successful!");

            window.location.href="/login";

        }else{

            alert(data.message);

        }

    }catch(error){

        console.error(error);
        alert("Unable to connect to the backend.");

    }

});

</script>
    



</body>
</html>
