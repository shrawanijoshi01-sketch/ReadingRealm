<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Reading Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    font-family:'Plus Jakarta Sans';
    background: linear-gradient(135deg, #fff0f5, #fce7f3, #f3e8ff);
    min-height:100vh;
}
.title{ font-family:'Playfair Display'; }
.gradient{ background:linear-gradient(135deg, #b10e6b, #783eb2); }
.glass-card{
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4);
}
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="glass-card w-full max-w-md rounded-3xl p-8 shadow-2xl text-center">
    <a href="/" class="inline-block title text-3xl font-bold text-pink-700 mb-2">✨ Reading Realm</a>
    <h2 class="text-2xl font-bold text-gray-800 mb-1">Welcome Back!</h2>
    <p class="text-sm text-gray-600 mb-6">Enter your credentials to enter the magical realm</p>

    <form id="loginForm" class="space-y-4 text-left">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
           <input
    type="email"
    id="email"
    name="email"
    required
    placeholder="reader@realm.com"
    class="w-full px-4 py-3 rounded-2xl border border-pink-200 outline-none focus:ring-2 focus:ring-pink-400 bg-white/80">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input
    type="password"
    id="password"
    name="password"
    required
    placeholder="••••••••"
    class="w-full px-4 py-3 rounded-2xl border border-pink-200 outline-none focus:ring-2 focus:ring-pink-400 bg-white/80">
        </div>

        <div class="flex items-center justify-between text-xs text-gray-600 pt-1">
            <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" class="rounded text-pink-600 focus:ring-pink-400"> Remember me
            </label>
            <a href="#" class="text-pink-600 font-semibold hover:underline">Forgot password?</a>
        </div>

        <button type="submit" class="w-full gradient text-white py-3.5 rounded-2xl font-bold hover:scale-[1.02] active:scale-95 transition-all shadow-lg mt-4">
            Sign In to Realm
        </button>
    </form>

    <p class="text-xs text-gray-600 mt-6">
        Don't have an account? <a href="/register" class="text-pink-600 font-bold hover:underline">Create Account</a>
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const formData = new FormData();
    formData.append("email", email);
    formData.append("password", password);

    try {

        const response = await fetch("/login", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (data.success) {

            localStorage.setItem("rr_user", JSON.stringify({
                username: data.username,
                email: email,
                role: data.role,
                isLoggedIn: true
            }));

            alert("Login Successful! 🎉");

            window.location.href = data.redirect;

        } else {

            alert(data.message);

        }

    } catch (error) {

        alert("Server Error!");

    }

});
</script>
</body>
</html>
