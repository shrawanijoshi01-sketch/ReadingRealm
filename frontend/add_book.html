<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Book | Reading Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
font-family:'Plus Jakarta Sans';
background:linear-gradient(135deg,#fff0f5,#fde7f3,#f4e8ff);
min-height:100vh;
}

.title{
font-family:'Playfair Display';
}

.glass{
background:rgba(255,255,255,.75);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.4);
}

.gradient{
background:linear-gradient(135deg,#c21874,#8e44ad);
}

</style>

</head>

<body>
<div class="mb-6">
    <a href="/admin"
       class="inline-flex items-center gap-2 text-white font-semibold px-5 py-3 rounded-2xl shadow-lg hover:scale-105 transition"
       style="background:linear-gradient(135deg,#c21874,#8e44ad);">

        ← Back to Dashboard

    </a>
</div>
<div class="max-w-3xl mx-auto py-12 px-6">

<div class="glass rounded-3xl shadow-2xl p-10">

<h1 class="title text-5xl text-center text-pink-700 font-bold">
📚 Add New Book
</h1>

<p class="text-center text-gray-600 mt-3 mb-8">
Add a new book to the Reading Realm collection.
</p>

<form id="bookForm" class="space-y-5">

<input
name="title"
placeholder="Book Title"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<input
name="author"
placeholder="Author"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<input
name="genre"
placeholder="Genre"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<textarea
name="description"
placeholder="Book Description"
required
rows="4"
class="w-full p-4 rounded-2xl border border-pink-200 outline-none"></textarea>

<input
type="number"
step="0.1"
name="rating"
placeholder="Rating"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<input
type="number"
name="price"
placeholder="Price"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<input
name="image"
placeholder="Image Path (Example: images/atomic_habits.jpg)"
required
class="w-full p-4 rounded-2xl border border-pink-200 outline-none">

<button
type="submit"
class="gradient w-full text-white py-4 rounded-2xl text-lg font-bold hover:scale-105 transition">

➕ Add Book

</button>

</form>

</div>

</div>

<script>

document.getElementById("bookForm").addEventListener("submit", async function(e){

e.preventDefault();

const formData=new FormData(this);

const response=await fetch("/api/add-book",{

method:"POST",

body:formData

});

const data=await response.json();

alert(data.message);

this.reset();

});

</script>

</body>
</html>
