<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Book | Reading Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:'Plus Jakarta Sans';
    background:linear-gradient(135deg,#fff0f5,#fde7f3,#f4e8ff);
    min-height:100vh;
}

.title{
    font-family:'Playfair Display';
}

.glass{
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.4);
}

.gradient{
    background:linear-gradient(135deg,#c21874,#8e44ad);
}

</style>

</head>

<body>

<div class="max-w-3xl mx-auto py-12 px-6">

<div class="mb-6">

<a href="/manage-books"
class="gradient text-white px-6 py-3 rounded-2xl font-bold">

← Back to Manage Books

</a>

</div>

<div class="glass rounded-3xl shadow-2xl p-10">

<h1 class="title text-5xl text-center text-pink-700 font-bold">

✏ Edit Book

</h1>

<p class="text-center text-gray-600 mt-2 mb-8">

Update the details of your book.

</p>

<form id="editForm" class="space-y-5">

<input
id="title"
name="title"
placeholder="Book Title"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<input
id="author"
name="author"
placeholder="Author"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<input
id="genre"
name="genre"
placeholder="Genre"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<textarea
id="description"
name="description"
rows="4"
placeholder="Description"
required
class="w-full p-4 rounded-2xl border border-pink-200"></textarea>

<input
id="rating"
type="number"
step="0.1"
name="rating"
placeholder="Rating"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<input
id="price"
type="number"
name="price"
placeholder="Price"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<input
id="image"
name="image"
placeholder="Image Path"
required
class="w-full p-4 rounded-2xl border border-pink-200">

<button
type="submit"
class="gradient w-full text-white py-4 rounded-2xl font-bold text-lg hover:scale-105 transition">

💾 Save Changes

</button>

</form>

</div>

</div>

<script>

// Get book id from URL
const bookId = window.location.pathname.split("/").pop();

async function loadBook(){

    const response = await fetch("/api/book/" + bookId);

    const book = await response.json();

    document.getElementById("title").value = book.title;
    document.getElementById("author").value = book.author;
    document.getElementById("genre").value = book.genre;
    document.getElementById("description").value = book.description;
    document.getElementById("rating").value = book.rating;
    document.getElementById("price").value = book.price;
    document.getElementById("image").value = book.image;

}

loadBook();

document.getElementById("editForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/api/update-book/" + bookId,{

        method:"PUT",

        body:formData

    });

    const data = await response.json();

    alert(data.message);

    window.location.href="/manage-books";

});

</script>

</body>
</html>
